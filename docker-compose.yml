services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://claims:claims@db:5432/claims
      # Flip these once you have a key and/or a trained classifier -- see
      # backend/app/config.py and backend/README (below) for what each does.
      VISION_BACKEND: mock
      GEMINI_API_KEY: ""
      CONSISTENCY_BACKEND: rules
      # Hosted LLM gateway -- empty keys mean the provider is skipped and
      # the offline mock provider answers, so this runs with zero keys.
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: ""
      LLM_CACHE_PATH: /app/data/llm_cache.sqlite3
      ALLOW_RESTRICTED_TO_HOSTED: "false"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - llmcache:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  llmcache:
